<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hi Bossing! ✨🐻</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink: #ff6b9d;
      --purple: #9d4edd;
      --gold: #ffd166;
      --glass: rgba(20, 15, 30, 0.55);
      --border: rgba(255, 255, 255, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #fff;
      overflow: hidden;
      position: relative;
      background-color: #1a1025;
    }

    /* Fullscreen Photo Background */
    .bg-photo {
      position: fixed;
      inset: 0;
      background-image: url('51769.jpg');
      background-size: cover;
      background-position: center;
      z-index: 0;
      transform: scale(1.03);
      transition: filter 0.6s ease, transform 0.8s ease;
    }

    /* Soft dark gradient overlay so text & buttons always pop */
    .bg-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(15, 10, 25, 0.25) 0%,
        rgba(15, 10, 25, 0.55) 60%,
        rgba(15, 10, 25, 0.85) 100%
      );
      z-index: 1;
      pointer-events: none;
    }

    /* Sparkle Canvas */
    #sparkle-canvas {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none; /* Ensures it NEVER blocks button clicks */
    }

    /* Screen / Page Container */
    .screen {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 400px;
      padding: 2rem 1.6rem;
      background: var(--glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid var(--border);
      border-radius: 28px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      display: none;
      animation: popIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .screen.active {
      display: block;
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.88) translateY(20px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .badge {
      font-size: 3.6rem;
      display: inline-block;
      margin-bottom: 0.5rem;
      animation: float 2.5s ease-in-out infinite;
      cursor: pointer;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-8px) rotate(4deg); }
    }

    h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 2.1rem;
      background: linear-gradient(135deg, #ffffff 20%, var(--pink) 65%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.6rem;
      line-height: 1.15;
    }

    p {
      font-size: 1rem;
      color: #f1f5f9;
      line-height: 1.55;
      margin-bottom: 1.5rem;
    }

    /* Interactive Buttons */
    .btn-row {
      display: flex;
      gap: 0.85rem;
      justify-content: center;
      flex-wrap: wrap;
      position: relative;
      min-height: 54px;
    }

    button {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.05rem;
      padding: 0.85rem 1.5rem;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .btn-main {
      background: linear-gradient(135deg, var(--pink), var(--purple));
      color: #fff;
      box-shadow: 0 8px 20px rgba(255, 107, 157, 0.45);
    }

    .btn-main:active {
      transform: scale(0.94);
    }

    .btn-alt {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    /* Page 2: Tap Heart/Bear Counter */
    .meter-wrap {
      background: rgba(0, 0, 0, 0.35);
      border-radius: 16px;
      padding: 0.9rem;
      margin-bottom: 1.4rem;
    }

    .meter-bar {
      width: 100%;
      height: 12px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 0.5rem;
    }

    .meter-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--pink), var(--gold));
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    /* Page 3: Secret Note & Photo Toggle */
    .note-box {
      background: rgba(255, 255, 255, 0.12);
      border-left: 4px solid var(--pink);
      border-radius: 12px;
      padding: 1rem;
      text-align: left;
      font-size: 0.95rem;
      margin-bottom: 1.4rem;
      color: #fff;
    }

    /* Floating Clear-View Toggle Button in Corner */
    .view-photo-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 20;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 0.5rem 0.9rem;
      font-size: 0.85rem;
      border-radius: 999px;
    }

    /* When user wants to see the background photo clearly */
    body.clear-view .screen {
      opacity: 0.12;
      pointer-events: none;
    }
    body.clear-view .bg-overlay {
      opacity: 0.1;
    }
  </style>
</head>
<body>

  <!-- Background Photo + Overlay -->
  <div class="bg-photo" id="bg-photo"></div>
  <div class="bg-overlay"></div>
  <canvas id="sparkle-canvas"></canvas>

  <!-- Hold/Tap button to admire the background photo -->
  <button class="view-photo-btn" id="peek-btn">👀 Peek Photo</button>

  <!-- PAGE 1: Greeting -->
  <div
